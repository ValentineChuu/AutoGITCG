[project]
name = "autogitcg"
version = "0.0.1"
description = "Reinforcement-learning bot for Genius Invokation TCG"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
training = ["torch>=2.9"]
analysis = ["matplotlib>=3.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autogitcg*", "experiments*"]
